<!doctype html>
<html lang="sw">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#12304F" />
    <meta
      name="description"
      content="Mwalimu wa Biblia na Roho ya Unabii. Majibu yenye marejeo kutoka Biblia, mafundisho ya robo mwaka, na vitabu vya Ellen G. White."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Biblia na Unabii</title>
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <img class="brand-mark" src="/icon.svg" alt="" />
        <div class="brand-text">
          <span class="brand-name" id="brandName">Biblia na Unabii</span>
          <span class="brand-tag" id="brandTag">Mwalimu wa Biblia na Roho ya Unabii</span>
        </div>
        <div class="header-actions">
          <button type="button" class="ghost" id="btnClear" hidden>Anza upya</button>
          <button type="button" class="ghost" id="btnAbout">Vyanzo</button>
          <div class="lang-toggle" role="group" aria-label="Language">
            <button type="button" id="langSw" class="active">SW</button>
            <button type="button" id="langEn">EN</button>
          </div>
        </div>
      </div>
    </header>

    <main class="main" id="main"></main>

    <div class="composer" id="composer">
      <form id="composerForm">
        <textarea
          id="q"
          rows="1"
          maxlength="600"
          placeholder="Andika swali lako au nisalimie..."
          aria-label="Swali lako"
          enterkeyhint="send"
        ></textarea>
        <button type="submit" class="send" id="send" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M4 12l16-8-6 8 6 8-16-8z" fill="currentColor" />
          </svg>
          <span class="sr-only">Tuma</span>
        </button>
      </form>
      <p class="composer-note" id="composerNote"></p>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Sehemu za app">
      <div class="tabbar-inner">
        <button type="button" class="tab-btn" data-tab="home">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3.2 3.5 10v10.3a.7.7 0 0 0 .7.7h5.3v-6.4h5v6.4h5.3a.7.7 0 0 0 .7-.7V10z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          </svg>
          <span data-tab-label="home">Nyumbani</span>
        </button>
        <button type="button" class="tab-btn" data-tab="bible">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 4.6h9.2c1 0 1.8.8 1.8 1.8v13H6.8A1.8 1.8 0 0 1 5 17.6zm12 0h2v14.8h-2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M9.4 8.2h4.4M9.4 11.4h4.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          </svg>
          <span data-tab-label="bible">Biblia</span>
        </button>
        <button type="button" class="tab-btn" data-tab="lessons">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4.4 5.6A1.6 1.6 0 0 1 6 4h4.2A1.8 1.8 0 0 1 12 5.8v13a1.4 1.4 0 0 0-1.4-1.2H4.4zm15.2 0A1.6 1.6 0 0 0 18 4h-4.2A1.8 1.8 0 0 0 12 5.8v13a1.4 1.4 0 0 1 1.4-1.2h6.2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
          </svg>
          <span data-tab-label="lessons">Masomo</span>
        </button>
        <button type="button" class="tab-btn" data-tab="books">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4.4v15.2M4.6 6.6h4.2a3.2 3.2 0 0 1 3.2 3.2v9.8a2.6 2.6 0 0 0-2.6-2.6H4.6zm14.8 0h-4.2A3.2 3.2 0 0 0 12 9.8v9.8a2.6 2.6 0 0 1 2.6-2.6h4.8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span data-tab-label="books">Vitabu</span>
        </button>
        <button type="button" class="tab-btn" data-tab="chat">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.4 11.5c0 4-3.8 7.2-8.4 7.2-1 0-2-.2-2.9-.5L4.4 20l1.3-3.7a6.7 6.7 0 0 1-2.1-4.8C3.6 7.5 7.4 4.3 12 4.3s8.4 3.2 8.4 7.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          </svg>
          <span data-tab-label="chat">Mazungumzo</span>
        </button>
      </div>
    </nav>

    <div id="modalRoot"></div>
    <script src="/app.js" defer></script>
  </body>
</html>
